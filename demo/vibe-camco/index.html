<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CầmCố+ · Vay cầm cố cổ phiếu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6bff'/><path d='M8 21l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs><path d="M8 21l5-6 4 4 7-9" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="brand-name">CầmCố<span>+</span></div>
          <div class="brand-sub">Vay cầm cố cổ phiếu</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost-light sm" data-act="reset">↺ Khôi phục dữ liệu mẫu</button>
        <div class="muted-light">Dữ liệu lưu trên trình duyệt (localStorage)</div>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1 id="title">Tổng quan</h1>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <div class="asof">
          <label>Ngày tính lãi</label>
          <div class="asof-ctl">
            <button class="icon-btn" data-act="shift" data-d="-1" title="Lùi 1 ngày">‹</button>
            <input type="date" id="asof" />
            <button class="icon-btn" data-act="shift" data-d="1" title="Tiến 1 ngày">›</button>
            <button class="btn sm ghost" data-act="shift" data-d="30" title="Tua nhanh 30 ngày">+30 ngày</button>
            <button class="btn sm ghost" data-act="today">Hôm nay</button>
          </div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>
  <div id="tip" class="tip hidden"></div>

  <script src="app.js"></script>
</body>
</html>
